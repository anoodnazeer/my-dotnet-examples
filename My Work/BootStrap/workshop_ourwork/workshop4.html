    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            display: flex;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            height: 110vh;
            background: #40189D; /* Dark purple */
            color: white;
            transition: all 0.3s;
        }

        #sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            transition: 0.3s;
        }

        #sidebar a:hover {
            background: white;
            color: black;
        }

        #sidebar .sidebar-header {
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #sidebar .menu {
            list-style: none;
            padding: 0;
        }

        #sidebar .menu li {
            padding: 10px;
        }

        #sidebar .menu li i {
            margin-right: 10px;
        }

        #toggle-btn {
            display: none;
            background: #4A148C;
            color: white;
            border: none;
            padding: 10px;
            position: absolute;
            left: 10px;
            top: 10px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            #sidebar {
                margin-left: -250px;
                position: absolute;
            }

            #toggle-btn {
                display: block;
            }

            #sidebar.active {
                margin-left: 0;
            }
        }
    </style>
</head>
