<body>
    <script>

        const add=function(a,b)
        {
           return(a+b);
        }
        document.write(add(5,3));


        const multiply=function(a,b)
        {
            return(a*b);
        }

        document.write(multiply(4,5));

        const avarage=function(a,b,c)
        {
        
            return((a+b+c)/3);
        
        }
        let avg=avarage(5,10,15);
        document.write(avg);
    </script>
