<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div id="imageContainer">
      <p id="sampleP">abcd</p>
    </div>

    <script>
      let arr = ["ajmal", "alfiya", "anood", "nasif", "amina"];
      let container = document.getElementById("imageContainer")
      let samplePDetails = document.getElementById("sampleP");
      samplePDetails.style.backgroundColor = "red";
      arr.forEach(element => {
        let value = document.createElement("div")
        value.innerHTML = element
         

        container.appendChild(value)
        
      });
      
      function onload() {}
    </script>
  </body>
</html>
