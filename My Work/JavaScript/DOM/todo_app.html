<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        #todo-container { width: 300px; margin: 0 auto; border-style:outset;  border-color: burlywood;}
        ul { list-style: none; padding: 0; }
        li { background: #f1da85; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; }
        .completed { text-decoration: line-through; color: gray; }
        button { margin-left: 5px; border-radius: 5px; }
    </style>

</head>

<body>

    <h1>To-Do List</h1>
    <div id="todo-container">
        <input type="text" id="taskInput" placeholder="Add a new task">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let taskInput = document.getElementById("taskInput");
            let taskText = taskInput.value.trim();
            if (taskText === "") return;
            
            let li = document.createElement("li");
            li.innerHTML = `<span onclick="toggleTask(this)">${taskText}</span> 
                            <button onclick="removeTask(this)">❌</button>`;
            
            document.getElementById("taskList").appendChild(li);
            taskInput.value = "";
        }

        function toggleTask(task) {
            task.classList.toggle("completed");
        }

        function removeTask(button) {
            button.parentElement.remove();
        }
    </script>
    
</body>
</html>
