<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    let season=prompt("enter season");

    if (season== "summer")
    {
        document.write("Wear cotton cloths");
    }
    else if (season== "winter")
    {
        document.write("Wear woollen cloths");
    }
    else if (season== "rainy")
    {
        document.write("Use rain coats");
    }
    else
    {
        document.write("Wear as you wish"); 
    }
    </script>
</body>
</html>
