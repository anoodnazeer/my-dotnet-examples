<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            width: 200px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
        .card img {
            width: 50px;
            height:50px;
            border-radius: 5px;
        }
        .name {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0;
        }
     
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        // Array containing objects with name, color, and image
        const items = [
            { name: "Apple",  color: "Red", image: "images/brand_designer.png"  },
            { name: "Orange", color: "Orange", image: "images/brand_designer.png" },
            { name: "Item 3", color: "#5733FF", image: "images/brand_designer.png" }
        ];

         

        // Select the main container div
        const container = document.getElementById("container");

        // Loop through the array and create elements
        items.forEach(item => {
            // Create a card div
            let card = document.createElement("div");
            card.classList.add("card");

            // Create an image element
            let imgElement = document.createElement("img");
            imgElement.src = item.image;  
            imgElement.alt = item.name;

            // Create a name heading
            let nameElement = document.createElement("h3");
            nameElement.classList.add("name");
            nameElement.textContent = item.name;

            // Create a color paragraph
            let colorElement = document.createElement("p");
            colorElement.textContent = `Color: ${item.color}`;
            colorElement.style.color = item.color;

            // Append elements to the card
            card.appendChild(imgElement);
            card.appendChild(nameElement);
            card.appendChild(colorElement);

            // Append card to the main container
            container.appendChild(card);

            container.appendChild(card);
        });
    </script>

</body>
</html>
