<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let season=prompt("Enter season");
        switch(season)
        {
            case "summer" : document.write("Wear cotton cloths");
            break;
            case "winter" : document.write("Wear woollen cloths");
            break;
            case "rainy" : document.write("Use rain coats");
            break;
            case "spring" : document.write("Wear simple derss"); 
            break;
            default : document.write("Wear as you wish"); 
        }
    </script>
</body>
</html>
